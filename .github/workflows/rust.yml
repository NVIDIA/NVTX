---
name: Rust

'on':
  push:
    branches: [dev, release-v3, test-*]
    tags: [v*]
    paths:
      - .github/workflows/rust.yml
      - '**/Cargo.*'
      - c/include/**
      - rust/*.toml
      - rust/crates/**
      - rust/examples/**
      - rust/src/**
  pull_request:
    paths:
      - .github/workflows/rust.yml
      - '**/Cargo.*'
      - c/include/**
      - rust/*.toml
      - rust/crates/**
      - rust/examples/**
      - rust/src/**

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-rust
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_CACHE_PATH: |
    ~/.cargo/bin/
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    target/

jobs:
  msrv:
    name: Minimum supported Rust version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rv: 1.77.0
          - runner: windows-latest
            rv: 1.82.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_CACHE_PATH }}
          key: "\
            ${{ runner.os }}-cargo-\
            ${{ steps.toolchain.outputs.cachekey }}-\
            ${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: "\
            ${{ runner.os }}-cargo-\
            ${{ steps.toolchain.outputs.cachekey }}-"
      - run: rustup install ${{ matrix.rv }}
      - run: >
          cargo +${{ matrix.rv }} check --workspace --all-targets --all-features

  deny:
    name: Deny
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_CACHE_PATH }}
          key: "\
            ${{ runner.os }}-cargo-deny-\
            ${{ steps.toolchain.outputs.cachekey }}"
          restore-keys: "\
            ${{ runner.os }}-cargo-deny-"
      - run: cargo install --locked cargo-deny || true
      - run: cargo deny --workspace --all-features check --show-stats

  rustfmt:
    name: Rustfmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
        f: [--all-features, --no-default-features]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_CACHE_PATH }}
          key: "\
            ${{ runner.os }}-cargo-check-\
            ${{ steps.toolchain.outputs.cachekey }}-\
            ${{ matrix.f }}-${{ hashFiles('**/Cargo.lock') }}"
          restore-keys: "\
            ${{ runner.os }}-cargo-check-\
            ${{ steps.toolchain.outputs.cachekey }}-\
            ${{ matrix.f }}-"
      - name: Check
        run: cargo check --workspace --all-targets ${{ matrix.f }}
      - name: Clippy
        run: >
          cargo clippy --workspace --all-targets ${{ matrix.f }} -- -Dwarnings
      - name: Test
        run: cargo test --workspace --all-targets ${{ matrix.f }}
      - name: Doctest
        run: cargo test --workspace --doc ${{ matrix.f }}
