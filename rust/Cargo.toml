[workspace]
members = ["crates/nvtx-sys"]

[workspace.package]
version = "2.0.0"
authors = ["NVIDIA", "Voltron Data"]
edition = "2021"
rust-version = "1.77.0"
description = "NVIDIA Tools Extension SDK"
repository = "https://github.com/NVIDIA/NVTX"
readme = "README.md"
publish = true
license = "Apache-2.0 WITH LLVM-exception"
keywords = ["cuda", "nsight", "nvidia", "nvtx", "profiling"]
categories = ["api-bindings", "development-tools::profiling", "no-std"]

[workspace.dependencies]
# Keep the local development path and the crates.io version coupled for publishing.
nvtx-sys = { version = "2.0.0", path = "crates/nvtx-sys", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
mod_module_files = "deny"
self_named_module_files = "allow"
alloc_instead_of_core = "deny"
pub_use = "allow"
pub_without_shorthand = "deny"
pub_with_shorthand = "allow"
arbitrary_source_item_ordering = "allow"
implicit_return = "allow"
single_call_fn = "allow"
question_mark_used = "allow"
print_stdout = "warn"
use_debug = "warn"
todo = "warn"
unimplemented = "warn"
panic = "deny"
shadow_same = "allow"
shadow_reuse = "allow"
shadow_unrelated = "allow"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "allow"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
unreadable_literal = "allow"
arithmetic_side_effects = "allow"
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

[package]
name = "nvtx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "nvtx"

[features]
default = [
    "std",
    "color-name",
    "name-current-thread",
    "cuda",
    "cuda_runtime",
    "tracing",
]
std = ["alloc", "nvtx-sys/std", "widestring/std"]
# `alloc` uses `spin::Mutex` for domain caches because `std::sync::Mutex` is unavailable.
alloc = ["dep:spin", "nvtx-sys/alloc", "widestring/alloc"]
color-name = ["std", "dep:color-name"]
name-current-thread = ["std", "dep:gettid"]
cuda = ["nvtx-sys/cuda"]
cuda_runtime = ["nvtx-sys/cuda_runtime"]
tracing = [
    "std",
    "color-name",
    "dep:tracing-core",
    "dep:tracing-subscriber",
]

[dependencies]
color-name = { version = "1.2.0", optional = true }
gettid = { version = "0.1.4", optional = true }
nvtx-sys.workspace = true
spin = { version = "0.10.0", optional = true }
tracing-core = { version = "0.1.36", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
widestring = { version = "1.2.1", default-features = false }

[dev-dependencies]
tracing = { version = "0.1.41", features = ["attributes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[[example]]
name = "domain"
required-features = ["color-name"]

[[example]]
name = "range"
required-features = ["color-name"]

[[example]]
name = "range_start_end"
required-features = ["color-name"]

[[example]]
name = "threads"
required-features = ["name-current-thread"]

[[example]]
name = "domain_threads"
required-features = ["name-current-thread"]

[[example]]
name = "tracing"
required-features = ["tracing"]

[lints]
workspace = true
