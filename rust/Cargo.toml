[workspace]
members = ["crates/nvtx-sys"]

[workspace.package]
version = "0.2.2"
authors = ["NVIDIA", "Voltron Data"]
edition = "2021"
rust-version = "1.77.0"
description = "NVIDIA Tools Extension SDK"
repository = "https://github.com/NVIDIA/NVTX"
readme = "README.md"
publish = false
license = "Apache-2.0 WITH LLVM-exception"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
mod_module_files = "deny"
self_named_module_files = "allow"
alloc_instead_of_core = "deny"
pub_use = "allow"
pub_without_shorthand = "deny"
pub_with_shorthand = "allow"
arbitrary_source_item_ordering = "allow"
implicit_return = "allow"
single_call_fn = "allow"
question_mark_used = "allow"
print_stdout = "warn"
use_debug = "warn"
todo = "warn"
unimplemented = "warn"
panic = "deny"
shadow_same = "allow"
shadow_reuse = "allow"
shadow_unrelated = "allow"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "allow"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
unreadable_literal = "allow"
arithmetic_side_effects = "allow"
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

[package]
name = "nvidia-nvtx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "nvtx"

[features]
default = [
    "color-name",
    "name-current-thread",
    "cuda",
    "cuda_runtime",
    "tracing",
]
color-name = ["dep:color-name"]
name-current-thread = ["dep:gettid"]
cuda = ["nvtx-sys/cuda"]
cuda_runtime = ["nvtx-sys/cuda_runtime"]
tracing = ["dep:tracing-core", "dep:tracing-subscriber", "dep:color-name"]

[dependencies]
color-name = { version = "1.2.0", optional = true }
derive_builder = "0.20"
gettid = { version = "0.1.4", optional = true }
nvtx-sys = { path = "crates/nvtx-sys" }
tracing-core = { version = "0.1.36", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
widestring = "1.2.1"

[dev-dependencies]
tracing = { version = "0.1.41", features = ["attributes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[[example]]
name = "domain"
required-features = ["color-name"]

[[example]]
name = "range"
required-features = ["color-name"]

[[example]]
name = "range_start_end"
required-features = ["color-name"]

[[example]]
name = "threads"
required-features = ["name-current-thread"]

[[example]]
name = "domain_threads"
required-features = ["name-current-thread"]

[[example]]
name = "tracing"
required-features = ["tracing"]

[lints]
workspace = true
