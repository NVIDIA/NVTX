---
include:
  - local: /.gitlab/ci/common.yml

.core-template:
  timeout: 10m
  interruptible: true
  artifacts:
    when: on_failure
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/core.yml
        - CMakeLists.txt
        - c/CMakeLists.txt
        - c/*.cmake
        - c/*.in
        - c/include/**/*
        - c/src/**/*
        - tests/**/*

.core-linux-x64:
  extends: .core-template
  tags: [linux, x64]

.core-windows-x64:
  extends:
    - .core-template
    - .windows-retry-template
  tags: [windows, x64]

'Core (Linux, x64)':
  extends: .core-linux-x64
  parallel:
    matrix:
      - TOOLCHAIN: [nvhpc]
        VERSION: ["25.7", "25.9", "25.11", "26.1", "26.3"]
      - TOOLCHAIN: [gcc]
        VERSION: ["9", "10", "11", "12", "13", "14"]
      - TOOLCHAIN: [clang]
        VERSION: ["14", "15", "16", "17", "18", "19", "20"]
      - TOOLCHAIN: [aocc]
        VERSION: ["5.0.0", "5.1.0"]
  artifacts:
    paths: [tests/build-linux-$TOOLCHAIN-$VERSION/]
  script:
    - tests/scripts/build-linux-$TOOLCHAIN.sh $VERSION
    - cd tests/build-linux-$TOOLCHAIN-$VERSION
    - ctest --output-on-failure

'Core (Linux, x64, MinGW-w64 GCC) (build only)':
  extends: .core-linux-x64
  artifacts:
    paths: [tests/build-linux-mingw-w64-gcc/]
  script: [tests/scripts/build-linux-mingw-w64-gcc.sh]

'Core (Windows, x64, VS)':
  extends: .core-windows-x64
  parallel:
    matrix:
      - VS_YEAR: ["2026", "2022", "2019", "2017", "2015"]
        ARCH: [x64, x64_x86]
  artifacts:
    paths: [tests/build-windows-vs$VS_YEAR-$ARCH/]
  script:
    - tests/scripts/build-windows-vs.ps1 $env:VS_YEAR $env:ARCH
    - tests/scripts/run-windows-vs.ps1 $env:VS_YEAR $env:ARCH

'Core (Windows, x64, VS, Arm64) (build only)':
  extends: .core-windows-x64
  parallel:
    matrix:
      - VS_YEAR: ["2026", "2022", "2019"]
  artifacts:
    paths: [tests/build-windows-vs$VS_YEAR-x64_arm64/]
  script: [tests/scripts/build-windows-vs.ps1 $env:VS_YEAR x64_arm64]

'Core (Windows, x64, MSYS2)':
  extends: .core-windows-x64
  parallel:
    matrix:
      - MSYSTEM: UCRT64
        COMPILER: [gcc, clang]
      - MSYSTEM: CLANG64
        COMPILER: clang
      - MSYSTEM: MINGW64
        COMPILER: [gcc, clang]
      - MSYSTEM: MINGW32
        COMPILER: [gcc, clang]
  artifacts:
    paths: [tests/build-windows-msys2-*-$COMPILER/]
  script:
    - tests/scripts/build-windows-msys2.ps1 $env:MSYSTEM $env:COMPILER
    - tests/scripts/run-windows-msys2.ps1 $env:MSYSTEM $env:COMPILER

'Core (Windows, x64, Cygwin)':
  extends: .core-windows-x64
  parallel:
    matrix:
      - ARCH: x64
        COMPILER: [gcc, clang]
      - ARCH: x86
        COMPILER: gcc
  artifacts:
    paths: [tests/build-windows-cygwin*-$COMPILER/]
  script:
    - tests/scripts/build-windows-cygwin.ps1 $env:ARCH $env:COMPILER
    - tests/scripts/run-windows-cygwin.ps1 $env:ARCH $env:COMPILER

'Build and test Core packages':
  extends: .manual-mode
  trigger:
    include:
      - local: /.gitlab/ci/core.yml
      - local: /.gitlab/ci/core-artifacts.yml
    strategy: depend
