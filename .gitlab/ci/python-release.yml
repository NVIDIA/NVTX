---
include:
  - local: /.gitlab/ci/common.yml

.python-wheel-template:
  artifacts:
    when: always
    expire_in: 14 days

'Python sdist':
  artifacts:
    when: always
    expire_in: 14 days

'Upload Python artifacts (Artifactory)':
  stage: upload
  tags: [linux, x64]
  rules:
    - if: >-
        $CI_COMMIT_BRANCH == "dev" ||
        $CI_COMMIT_BRANCH == "release-v3"
      when: manual
      allow_failure: false
  environment:
    name: python-upload
  variables:
    JFROG_CLI_HOME_DIR: "$CI_PROJECT_DIR/.jfrog"
  artifacts:
    expire_in: 14 days
    paths:
      - artifactory-sdist-upload.json
      - artifactory-wheels-upload.json
  needs:
    - job: 'Python sdist'
      artifacts: true
    - job: 'Python (Linux, x64)'
      artifacts: true
    - job: 'Python (Linux, arm64)'
      artifacts: true
    - job: 'Python (Windows, x64)'
      artifacts: true
    - job: 'Python (Windows, arm64)'
      artifacts: true
  id_tokens:
    JFROG_CLI_OIDC_EXCHANGE_TOKEN_ID:
      aud: $ARTIFACTORY_OIDC_AUDIENCE
  script:
    - .gitlab/ci/scripts/python-upload.sh

.python-publish-template:
  tags: [linux, x64]
  interruptible: false
  timeout: 2 hours
  needs:
    - job: 'Upload Python artifacts (Artifactory)'
      artifacts: true
  environment:
    name: python-publish
  artifacts:
    expire_in: 30 days
    when: always
    paths:
      - publisher-release.json
      - publisher-status.json

'Publish Python artifacts (test)':
  extends: .python-publish-template
  stage: publish-test
  rules:
    - if: >-
        $CI_COMMIT_BRANCH == "dev" ||
        $CI_COMMIT_BRANCH == "release-v3"
      when: manual
      allow_failure: false
  script:
    - .gitlab/ci/scripts/python-publish.sh false

'Publish Python artifacts':
  extends: .python-publish-template
  stage: publish
  needs:
    - job: 'Upload Python artifacts (Artifactory)'
      artifacts: true
    - job: 'Publish Python artifacts (test)'
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "release-v3"'
      when: manual
      allow_failure: false
  script:
    - .gitlab/ci/scripts/python-publish.sh true
  manual_confirmation: >-
    Publish artifacts? This releases to public package repositories.
    IRREVERSIBLE ACTION!!!.
