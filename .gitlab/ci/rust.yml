---
include:
  - local: /.gitlab/ci/common.yml

.rust-template:
  timeout: 10m
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/common.yml
        - .gitlab/ci/rust.yml
        - '**/Cargo.*'
        - c/include/*
        - c/include/**/*
        - rust/*.ps1
        - rust/*.sh
        - rust/*.toml
        - rust/crates/*
        - rust/crates/**/*
        - rust/examples/*
        - rust/examples/**/*
        - rust/src/*
        - rust/src/**/*

'Rust (Linux, x64)':
  tags: [linux, x64]
  extends: .rust-template
  script:
    - cd rust
    - ./check.sh

'Rust (Windows, x64)':
  tags: [windows, x64]
  extends:
    - .rust-template
    - .windows-retry-template
  script:
    - $env:PATH = "$env:RUSTPATH\bin;$env:PATH"
    - $env:LIBCLANG_PATH = "$env:VSPATH\VC\Tools\Llvm\x64\bin"
    - cd rust
    - ./check.ps1

'Build and test Rust packages':
  extends: .manual-mode
  trigger:
    include:
      - local: /.gitlab/ci/rust.yml
    strategy: depend
